services:
  db:
    image: pgvector/pgvector:pg16
    container_name: insulation-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insulation_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insulation-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/insulation_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    env_file:
      - .env

volumes:
  pgdata:
  uploads:
